name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      props:
        description: 'JSON string of video props'
        required: false
        default: ''
      video_query:
        description: 'YouTube search query for background fancam/trailer (e.g. "NMIXX Haewon fancam 4k vertical")'
        required: false
        default: ''
      video_url:
        description: 'Direct video URL (optional)'
        required: false
        default: ''
      composition:
        description: 'Composition ID to render'
        required: false
        default: 'SeoulSourceReel'
      output_name:
        description: 'Output video filename'
        required: false
        default: 'seoulsource_video'
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write
  actions: write

jobs:
  render:
    name: Render Video on Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules & Remotion
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-remotion-v1-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-v1-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Cache yt-dlp Executable
        uses: actions/cache@v4
        id: cache-ytdlp
        with:
          path: ~/.local/bin/yt-dlp
          key: ${{ runner.os }}-ytdlp-v1

      - name: Install yt-dlp (Cache Miss)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
          chmod a+rx ~/.local/bin/yt-dlp

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Background Video (yt-dlp)
        id: download_video
        run: |
          mkdir -p public
          QUERY="${{ github.event.inputs.video_query }}"
          DIRECT_URL="${{ github.event.inputs.video_url }}"

          if [ -n "$DIRECT_URL" ]; then
            echo "📥 Mengunduh video dari Direct URL: $DIRECT_URL"
            yt-dlp \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "$DIRECT_URL" || echo "Direct URL download failed, continuing without background video."
          elif [ -n "$QUERY" ]; then
            echo "🔍 Mencari & mengunduh video via yt-dlp search: $QUERY"
            yt-dlp \
              --default-search "ytsearch" \
              --extractor-args "youtube:player_client=android,web" \
              --download-sections "*0:05-0:20" \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "ytsearch1:$QUERY" || echo "ytsearch download failed, continuing with static fallback."
          fi

          if [ -f "public/bg_video.mp4" ]; then
            echo "✅ Background video siap: $(ls -lh public/bg_video.mp4)"
            echo "has_bg_video=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ Tidak ada background video. Menggunakan mode foto statis."
            echo "has_bg_video=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Props JSON
        id: prepare_props
        run: |
          PROPS_INPUT='${{ github.event.inputs.props }}'
          if [ -n "$PROPS_INPUT" ]; then
            echo "$PROPS_INPUT" > input-props.json
            echo "Used props from workflow dispatch input."
          else
            cp props.json input-props.json
            echo "Fallback to default props.json."
          fi

          if [ -f "public/bg_video.mp4" ]; then
            echo "Menambahkan backgroundVideo ke input-props.json..."
            jq '. + {backgroundVideo: "bg_video.mp4"}' input-props.json > input-props.tmp.json && mv input-props.tmp.json input-props.json
          fi
          cat input-props.json

      - name: Render Video
        run: |
          mkdir -p out
          COMP_NAME="${{ github.event.inputs.composition || 'SeoulSourceReel' }}"
          OUT_NAME="${{ github.event.inputs.output_name || 'seoulsource_video' }}"
          echo "Rendering $COMP_NAME to out/${OUT_NAME}.mp4..."
          npx remotion render "$COMP_NAME" "out/${OUT_NAME}.mp4" --props="./input-props.json" --gl=angle --concurrency=2

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name || 'seoulsource_video' }}
          path: out/*.mp4
          retention-days: 7

      - name: Create GitHub Release with Video Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="render-${{ github.run_id }}"
          OUT_FILE=$(ls out/*.mp4 | head -n 1)
          echo "Creating release $TAG_NAME with file $OUT_FILE..."
          gh release create "$TAG_NAME" "$OUT_FILE" \
            --title "Render #${{ github.run_id }}" \
            --notes "Automated SeoulSource video render completed successfully."
