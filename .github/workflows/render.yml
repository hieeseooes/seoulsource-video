name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      props:
        description: 'JSON string of video props'
        required: false
        default: ''
      video_query:
        description: 'YouTube search query for background fancam/trailer (e.g. "NMIXX Haewon fancam 4k vertical")'
        required: false
        default: ''
      video_url:
        description: 'Direct video URL (optional)'
        required: false
        default: ''
      composition:
        description: 'Composition ID to render'
        required: false
        default: 'SeoulSourceReel'
      output_name:
        description: 'Output video filename'
        required: false
        default: 'seoulsource_video'
  repository_dispatch:
    types: [render_video]

permissions:
  contents: write
  actions: write

jobs:
  render:
    name: Render Video on Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            sudo timeout 60 apt-get update -qq || true
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Cache Node Modules & Remotion
        uses: actions/cache@v4
        id: cache-dependencies
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-remotion-v1-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-v1-

      - name: Install Dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Cache pip packages (yt-dlp & curl-cffi)
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ytdlp-curl-cffi-v1
          restore-keys: |
            ${{ runner.os }}-pip-ytdlp-curl-cffi-

      - name: Start Proof-of-Origin (POT) Provider Server
        run: |
          docker run --name bgutil-provider -d --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 3
          curl -s http://127.0.0.1:4416/ping || echo "POT provider initialized."

      - name: Install yt-dlp & POT Provider Plugin
        run: |
          pip install --upgrade "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider

      - name: Verify yt-dlp Impersonation Targets
        run: |
          yt-dlp --list-impersonate-targets || true

      - name: Setup YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
            echo "✅ YouTube cookies loaded from secrets."
          else
            echo "ℹ️ No YOUTUBE_COOKIES secret found, proceeding without cookies."
          fi

      - name: Download Background Video (yt-dlp)
        id: download_video
        run: |
          mkdir -p public
          QUERY="${{ github.event.inputs.video_query }}"
          DIRECT_URL="${{ github.event.inputs.video_url }}"
          COOKIE_ARGS=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARGS="--cookies cookies.txt"
          fi

          POT_ARGS="--extractor-args youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
          JS_ARGS="--js-runtimes node --remote-components ejs:github"

          if [ -n "$DIRECT_URL" ]; then
            echo "📥 Mengunduh video dari Direct URL: $DIRECT_URL"
            yt-dlp \
              $COOKIE_ARGS \
              $POT_ARGS \
              $JS_ARGS \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best" \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "$DIRECT_URL" || \
            yt-dlp \
              $POT_ARGS \
              $JS_ARGS \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best" \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "$DIRECT_URL" || echo "Direct URL download failed, continuing without background video."
          elif [ -n "$QUERY" ]; then
            echo "🔍 Mencari & mengunduh video via yt-dlp search: $QUERY"
            yt-dlp -v \
              $COOKIE_ARGS \
              $POT_ARGS \
              $JS_ARGS \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best" \
              --default-search "ytsearch" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "ytsearch1:$QUERY" || \
            yt-dlp -v \
              $POT_ARGS \
              $JS_ARGS \
              -f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best" \
              --default-search "ytsearch" \
              --merge-output-format mp4 \
              --force-overwrites \
              -o "public/bg_video.mp4" \
              "ytsearch1:$QUERY" || echo "ytsearch download failed, continuing with static fallback."
          fi

          if [ -f "public/bg_video.mp4" ]; then
            echo "⚡ Optimizing bg_video with faststart..."
            ffmpeg -y -i public/bg_video.mp4 -c copy -movflags +faststart public/bg_video_fast.mp4 && mv public/bg_video_fast.mp4 public/bg_video.mp4 || true
            echo "✅ Background video siap: $(ls -lh public/bg_video.mp4)"
            echo "has_bg_video=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ Tidak ada background video. Menggunakan mode foto statis."
            echo "has_bg_video=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Props JSON
        id: prepare_props
        env:
          PROPS_INPUT: ${{ github.event.inputs.props }}
        run: |
          if [ -n "$PROPS_INPUT" ]; then
            printf "%s" "$PROPS_INPUT" > input-props.json
            echo "Used props from workflow dispatch input."
          else
            cp props.json input-props.json
            echo "Fallback to default props.json."
          fi

          if [ -f "public/bg_video.mp4" ]; then
            echo "Menambahkan backgroundVideo ke input-props.json..."
            jq '. + {backgroundVideo: "bg_video.mp4"}' input-props.json > input-props.tmp.json && mv input-props.tmp.json input-props.json
          fi
          cat input-props.json

      - name: Generate Gemini Voiceover (Cloud TTS)
        id: generate_cloud_tts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_cloud_tts.js || echo "⚠️ Cloud TTS failed, rendering with fallback audio."

      - name: Render Video
        run: |
          mkdir -p out
          COMP_NAME="${{ github.event.inputs.composition || 'SeoulSourceReel' }}"
          OUT_NAME="${{ github.event.inputs.output_name || 'seoulsource_video' }}"
          echo "Rendering $COMP_NAME to out/${OUT_NAME}.mp4..."
          npx remotion render "$COMP_NAME" "out/${OUT_NAME}.mp4" --props="./input-props.json" --gl=angle --concurrency=2 --timeout=120000

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name || 'seoulsource_video' }}
          path: out/*.mp4
          retention-days: 7

      - name: Create GitHub Release with Video Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="render-${{ github.run_id }}"
          OUT_FILE=$(ls out/*.mp4 | head -n 1)
          echo "Creating release $TAG_NAME with file $OUT_FILE..."
          gh release create "$TAG_NAME" "$OUT_FILE" \
            --title "Render #${{ github.run_id }}" \
            --notes "Automated SeoulSource video render completed successfully."

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f cookies.txt
